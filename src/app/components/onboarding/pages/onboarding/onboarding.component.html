<div class="onboarding">
  <p-steps [model]="items" [activeIndex]="currentStep" [readonly]="true" />

  <p-card>
    @switch (currentStep) {
      @case (0) { <app-step-dui [dui]="documentNumber" (completed)="onDuiCompleted($event)" /> }
      @case (1) { <app-step-datos-basicos [documentNumber]="documentNumber" (completed)="next()" (back)="back()" /> }
      @case (2) { <app-step-foto-documento (completed)="next()" (back)="back()" /> }
      @case (3) { <app-step-video-vida (completed)="next()" (back)="back()" /> }
    }
  </p-card>

  <div class="cancel">
    <p-button label="Cancelar onboarding" icon="pi pi-times" severity="secondary" [text]="true"
              (onClick)="cancel()" />
  </div>
</div>
